<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SimpleLogicX - Premium software engineering solutions. We build SaaS platforms, AI systems, mobile apps and enterprise cloud infrastructure."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>SimpleLogicX — Engineering Digital Excellence</title>

    <!--
      No-flash theme script (§9.3).

      MUST stay inline, blocking, and in <head>. It runs before first paint so
      a user with a stored preference never sees a frame of the wrong theme.
      React cannot do this job: by the time it mounts, the page has painted.

      Users on "system" need no attribute at all — the CSS light-dark() tokens
      in styles/theme.css already follow prefers-color-scheme. We only write
      data-theme when the user has explicitly overridden the OS.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("slx-theme");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#050505" : "#ffffff");
        } catch (e) {
          /* storage blocked — fall through to OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
